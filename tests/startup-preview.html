<!doctype html>
<html lang="ja">
  <meta charset="utf-8">
  <title>Inventory Startup Preview</title>
  <aside>
    <button id="stock-ready">在庫の応答を返す</button>
    <button id="orders-ready">発注明細の応答を返す</button>
    <output id="requests" aria-label="模擬通信ログ"></output>
  </aside>
  <div id="root"></div>
  <script type="module">
    const storage = new Map([['invent_manage_supabase_session', JSON.stringify({
      access_token: 'fixture-token', user: { email: 'preview@example.test' },
    })]]);
    Object.defineProperty(window, 'localStorage', { value: {
      getItem: (key) => storage.get(key) ?? null,
      setItem: (key, value) => storage.set(key, String(value)),
      removeItem: (key) => storage.delete(key),
    } });

    function waitForButton(id) {
      const button = document.getElementById(id);
      return new Promise((resolve) => button.addEventListener('click', () => {
        button.disabled = true;
        resolve();
      }, { once: true }));
    }

    const stockGate = waitForButton('stock-ready');
    const ordersGate = waitForButton('orders-ready');
    const log = document.getElementById('requests');
    const record = (event) => { log.textContent += `${event} | `; };
    const currentMovement = { id: 2, child_asset_id: 1, movement_date: '2026-11-01', movement_type: 'out', quantity: 3 };
    const previousMovement = { id: 1, child_asset_id: 1, movement_date: '2026-06-15', movement_type: 'in', quantity: 10 };
    const orders = [
      { id: 1, child_asset_id: 1, asset_name: '起動検証品', supplier_name: '検証用発注先', quantity: 2, purchase_unit: '箱', status: 'requested', requested_at: '2026-11-02T02:00:00Z' },
      { id: 2, child_asset_id: 1, asset_name: '起動検証品', supplier_name: '検証用発注先', quantity: 3, purchase_unit: '箱', status: 'completed', requested_at: '2026-11-01T02:00:00Z' },
    ];
    const tables = {
      invent_suppliers: [{ id: 1, name: '検証用発注先' }],
      invent_staff: [{ id: 1, name: '検証担当' }],
      invent_parent_assets: [{ id: 1, generic_name: '起動検証品', category_id: 1 }],
      invent_child_assets: [{ id: 1, parent_id: 1, brand_name: '起動検証品', maker: '検証メーカー', supplier_id: 1, opening_stock: 10, fiscal_year_closed_at: '2026-06-30', usage_unit: '個', purchase_unit: '箱' }],
      invent_categories: [{ id: 1, name: '検証用', display_order: 1 }],
      invent_fiscal_snapshots: [{ id: 1, child_asset_id: 1, fiscal_year: 2025, opening_stock: 0, closing_stock: 10, closed_at: '2026-06-30' }],
    };

    // Every API response is local to this fixture; no inventory or storage writes leave the page.
    window.fetch = async (input, options = {}) => {
      const url = new URL(input, location.href);
      const table = url.pathname.split('/').at(-1);
      if (url.pathname.startsWith('/rest/v1/')) {
        if (table === 'invent_audit_logs') return Response.json([{ id: 1 }]);
        if (table === 'invent_order_requests') {
          if (options.method === 'HEAD' && url.searchParams.get('status') === 'eq.requested' && options.headers?.Prefer === 'count=exact') {
            record('pending count');
            return new Response(null, { headers: { 'Content-Range': '0-0/1' } });
          }
          if (url.searchParams.get('order') === 'requested_at.desc,id.asc') {
            record('order details');
            await ordersGate;
          }
          return Response.json(orders);
        }
        if (table === 'invent_stock_movements') {
          const filter = url.searchParams.get('movement_date');
          if (filter === 'gt.2026-06-30') {
            record('current movements');
            await stockGate;
            return Response.json([currentMovement]);
          }
          if (filter === 'gte.2025-07-01') {
            record('past-year movements');
            return Response.json([previousMovement]);
          }
          record('full backup movements');
          return Response.json([previousMovement, currentMovement]);
        }
        if (table in tables) return Response.json(tables[table]);
      }
      if (url.pathname === '/storage/v1/object/list/backups') return Response.json([]);
      if (url.pathname.startsWith('/storage/v1/object/backups/inventmanage/') && options.method === 'POST') {
        const payload = JSON.parse(options.body);
        record(`backup uploaded (${payload.tables.invent_stock_movements.length} movements)`);
        return Response.json({});
      }
      record(`unexpected request: ${options.method || 'GET'} ${url.pathname}`);
      return Response.json({ message: 'Unexpected request in startup preview' }, { status: 400 });
    };

    await import('../main.jsx');
  </script>
</html>
